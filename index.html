<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雲端打卡考勤管理系統 V3.4</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet.js 互動地圖 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .nav-tab-active {
      background-color: #ffffff;
      color: #4f46e5 !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      font-weight: 700;
    }
    #liveMap { z-index: 10; }
    .leaflet-control-attribution { display: none !important; }
  </style>
</head>
<body class="text-slate-800 antialiased pb-20 sm:pb-6">

  <!-- ================= 登入畫面 ================= -->
  <div id="loginOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 bg-opacity-95 backdrop-blur-md px-4">
    <div class="glass-panel p-8 sm:p-10 rounded-3xl w-full max-w-sm shadow-2xl relative overflow-hidden text-center">
      <div class="w-16 h-16 bg-indigo-100 rounded-2xl mx-auto flex items-center justify-center mb-6 transform rotate-3">
        <i class="fa-solid fa-fingerprint text-3xl text-indigo-600"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-800 mb-2 tracking-tight">系統登入</h2>
      <p class="text-sm text-slate-500 mb-8 font-medium">LINE & 雲端考勤管理系統 V3.4</p>
      
      <div class="space-y-4">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i class="fa-regular fa-user text-slate-400"></i>
          </div>
          <input type="text" id="loginUsername" placeholder="輸入使用者帳號" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 block pl-10 p-3.5 transition">
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i class="fa-solid fa-lock text-slate-400"></i>
          </div>
          <input type="password" id="loginPassword" placeholder="輸入密碼" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 block pl-10 p-3.5 transition" onkeypress="if(event.key === 'Enter') handleLogin()">
        </div>
        <button onclick="handleLogin()" class="w-full text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300 font-bold rounded-xl text-sm px-5 py-3.5 text-center transition shadow-lg shadow-indigo-500/30 active:scale-[0.98]">
          安全登入 <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 主系統介面 ================= -->
  <div id="mainApp" class="hidden max-w-5xl mx-auto p-3 sm:p-6 space-y-4 sm:space-y-6 relative">
    
    <!-- 頂部導航 -->
    <div class="glass-panel p-3 sm:p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="w-10 h-10 sm:w-12 sm:h-12 bg-indigo-600 text-white rounded-xl flex justify-center items-center font-bold text-lg sm:text-xl shadow-md">
          <span id="txtUserInitials">?</span>
        </div>
        <div>
          <h1 class="text-base sm:text-xl font-extrabold text-slate-800 tracking-tight flex items-center gap-2">
            <span id="txtWelcomeName">歡迎回來</span>
            <span id="roleBadge" class="hidden bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider border border-amber-200">Admin</span>
          </h1>
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium mt-0.5">今天也要活力滿滿喔！🚀</p>
        </div>
      </div>
      
      <!-- 桌面版分頁標籤 -->
      <div class="hidden sm:flex bg-indigo-600 p-1.5 rounded-2xl shadow-inner gap-1">
        <button id="tabBtnDaily" onclick="switchTab('daily')" class="nav-tab-active px-5 py-2 rounded-xl transition flex items-center gap-2 text-sm">
          <i class="fa-solid fa-location-dot"></i> GPS 打卡首頁
        </button>
        <button id="tabBtnSummary" onclick="switchTab('summary')" class="text-indigo-100 hover:text-white px-5 py-2 rounded-xl transition flex items-center gap-2 text-sm font-medium">
          <i class="fa-regular fa-calendar-days"></i> 考勤總表
        </button>
      </div>

      <!-- 右側登出 -->
      <div class="hidden sm:flex items-center gap-2">
        <button onclick="logout()" class="text-slate-500 hover:text-rose-600 bg-slate-100 hover:bg-rose-50 w-10 h-10 rounded-full flex justify-center items-center transition" title="登出系統">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>

    <!-- ================= 頁籤 1: 每日 GPS 打卡 ================= -->
    <div id="viewDailyContainer" class="space-y-4">
      <div class="glass-panel rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-200">
        
        <div class="flex justify-between items-center mb-4 pl-1">
          <div>
            <h2 class="text-lg font-extrabold text-slate-800">今日出勤打卡</h2>
            <p id="txtCurrentDateDisplay" class="text-xs text-slate-500 font-medium">2026-01-01</p>
          </div>
        </div>

        <!-- 地圖視窗 -->
        <div class="relative rounded-2xl overflow-hidden border-2 border-slate-200 shadow-sm mb-4">
          <div id="liveMap" class="w-full h-[220px] sm:h-[300px] z-10 bg-slate-100"></div>
          
          <div class="absolute top-2 right-2 z-[400] flex flex-col space-y-2">
            <button onclick="centerMapOnUser()" class="bg-white/90 hover:bg-white text-slate-700 p-2.5 rounded-xl shadow-md border border-slate-200 text-xs font-bold transition flex items-center justify-center" title="看我的位置">
              <i class="fa-solid fa-location-crosshairs text-indigo-600 text-lg"></i>
            </button>
            <button onclick="centerMapOnCompany()" class="bg-white/90 hover:bg-white text-slate-700 p-2.5 rounded-xl shadow-md border border-slate-200 text-xs font-bold transition flex items-center justify-center" title="看公司位置">
              <i class="fa-solid fa-building-flag text-rose-500 text-lg"></i>
            </button>
          </div>

          <div class="bg-slate-800 text-white px-3 py-2 text-[11px] flex justify-between items-center">
            <div id="mapInfoPos" class="font-mono text-slate-300 truncate">目前座標：擷取中...</div>
            <div id="mapInfoAcc" class="text-amber-300 font-bold shrink-0 ml-2">精確度：--</div>
          </div>
        </div>

        <!-- GPS 狀態 -->
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3 mb-5">
          <div class="flex items-center space-x-2 w-full">
            <div id="gpsStatusIcon" class="w-10 h-10 rounded-full bg-amber-100 text-amber-500 flex items-center justify-center shrink-0">
              <i class="fa-solid fa-spinner fa-spin text-lg"></i>
            </div>
            <div class="flex-1">
              <div id="gpsStatusText" class="text-sm font-bold text-slate-800">定位擷取中...</div>
              <div class="text-[11px] text-slate-500 font-medium">打卡範圍設定 <span id="txtCompanyRadiusDisplay" class="text-indigo-600 font-bold">200</span>m</div>
            </div>
          </div>
          <button onclick="updateCurrentPositionOnly()" class="w-full sm:w-auto text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold px-4 py-2 rounded-xl transition flex justify-center items-center gap-1.5 shrink-0">
            <i class="fa-solid fa-rotate"></i> 更新定位
          </button>
        </div>

        <!-- 打卡按鈕 (含防呆鎖定) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
          <button id="btnClockIn" onclick="doClockAction('clockIn')" class="relative group overflow-hidden bg-gradient-to-br from-emerald-400 to-emerald-600 text-white p-4 sm:p-5 rounded-2xl shadow-lg hover:shadow-xl transition active:scale-95 flex flex-col items-center justify-center gap-1">
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
            <i class="fa-solid fa-fingerprint text-3xl sm:text-4xl mb-1 relative z-10"></i>
            <span class="font-extrabold text-base sm:text-lg tracking-wider relative z-10">上班打卡</span>
            <span class="text-[10px] sm:text-xs text-emerald-100 font-medium relative z-10">(驗證 GPS 位置)</span>
          </button>
          
          <button id="btnClockOut" onclick="doClockAction('clockOut')" class="relative group overflow-hidden bg-gradient-to-br from-rose-400 to-rose-600 text-white p-4 sm:p-5 rounded-2xl shadow-lg hover:shadow-xl transition active:scale-95 flex flex-col items-center justify-center gap-1">
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
            <i class="fa-solid fa-house-person-leave text-3xl sm:text-4xl mb-1 relative z-10"></i>
            <span class="font-extrabold text-base sm:text-lg tracking-wider relative z-10">下班打卡</span>
            <span class="text-[10px] sm:text-xs text-rose-100 font-medium relative z-10">(驗證 GPS 位置)</span>
          </button>
        </div>
        
        <div class="mt-4 pt-4 border-t border-slate-100">
          <button onclick="openSingleLeaveModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 p-3 rounded-xl font-bold text-sm transition shadow-sm border border-slate-200 flex justify-center items-center gap-2">
            <i class="fa-solid fa-file-signature text-indigo-500"></i> 單日請假 / 特休申請
          </button>
        </div>

      </div>
    </div>

    <!-- ================= 頁籤 2: 考勤總表 ================= -->
    <div id="viewSummaryContainer" class="hidden space-y-4">
      
      <!-- 統計數據 -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <div class="glass-panel p-4 sm:p-5 rounded-2xl border border-rose-100 shadow-sm">
          <div class="flex items-center gap-2 mb-2 text-rose-500">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <h3 class="text-xs sm:text-sm font-bold">遲到 / 早退</h3>
          </div>
          <div class="flex items-end gap-1">
            <span id="statLateCount" class="text-2xl sm:text-3xl font-black text-slate-800">0</span>
            <span class="text-xs text-slate-500 mb-1 font-medium">次</span>
          </div>
          <div class="text-[10px] sm:text-xs text-slate-400 mt-1">共計 <span id="statLateMinutes" class="font-bold text-rose-500">0</span> 分鐘</div>
        </div>
        <div class="glass-panel p-4 sm:p-5 rounded-2xl border border-indigo-100 shadow-sm">
          <div class="flex items-center gap-2 mb-2 text-indigo-500">
            <i class="fa-solid fa-business-time"></i>
            <h3 class="text-xs sm:text-sm font-bold">本月加班時數</h3>
          </div>
          <div class="flex items-end gap-1">
            <span id="statOvertime" class="text-2xl sm:text-3xl font-black text-slate-800">0</span>
            <span class="text-xs text-slate-500 mb-1 font-medium">小時</span>
          </div>
        </div>
        <div class="glass-panel p-4 sm:p-5 rounded-2xl border border-amber-100 shadow-sm">
          <div class="flex items-center gap-2 mb-2 text-amber-500">
            <i class="fa-solid fa-file-medical"></i>
            <h3 class="text-xs sm:text-sm font-bold">本月請假 / 排休</h3>
          </div>
          <div class="flex items-end gap-1">
            <span id="statLeaveDays" class="text-2xl sm:text-3xl font-black text-slate-800">0</span>
            <span class="text-xs text-slate-500 mb-1 font-medium">天</span>
          </div>
        </div>
        <div class="glass-panel p-4 sm:p-5 rounded-2xl border border-emerald-100 shadow-sm">
          <div class="flex items-center justify-between mb-2 text-emerald-500">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-mug-hot"></i>
              <h3 class="text-xs sm:text-sm font-bold">年度特休</h3>
            </div>
            <span id="statSpecialLeaveInitial" class="bg-emerald-100 text-emerald-700 text-[9px] px-1.5 py-0.5 rounded font-bold">初始 0天</span>
          </div>
          <div class="flex items-end gap-1">
            <span id="statSpecialLeave" class="text-2xl sm:text-3xl font-black text-slate-800">0</span>
            <span class="text-xs text-slate-500 mb-1 font-medium">小時剩餘</span>
          </div>
          <div class="text-[10px] sm:text-xs text-slate-400 mt-1">約 <span id="statSpecialLeaveDaysRem" class="font-bold text-emerald-600">0</span> 天</div>
        </div>
      </div>

      <!-- 月曆 -->
      <div class="glass-panel rounded-3xl p-4 sm:p-6 shadow-sm">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4 mb-4">
          
          <div class="flex items-center gap-3">
            <button onclick="changeMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 hover:bg-indigo-100 text-slate-600 hover:text-indigo-600 transition">
              <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <h2 id="calendarMonthLabel" class="text-lg sm:text-xl font-black text-slate-800 tracking-tight w-24 text-center">2026-01</h2>
            <button onclick="changeMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 hover:bg-indigo-100 text-slate-600 hover:text-indigo-600 transition">
              <i class="fa-solid fa-chevron-right text-sm"></i>
            </button>
          </div>

          <!-- 切換員工 -->
          <div id="adminUserSelector" class="hidden w-full sm:w-auto">
            <select id="selEmployee" onchange="switchEmployeeView()" class="w-full sm:w-48 bg-slate-50 border border-slate-200 text-slate-700 text-sm font-bold rounded-xl focus:ring-4 focus:ring-indigo-500/25 block p-2.5">
            </select>
          </div>
        </div>

        <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2">
          <div class="text-center text-[10px] sm:text-xs font-black text-rose-500 py-1">週日</div>
          <div class="text-center text-[10px] sm:text-xs font-black text-slate-500 py-1">週一</div>
          <div class="text-center text-[10px] sm:text-xs font-black text-slate-500 py-1">週二</div>
          <div class="text-center text-[10px] sm:text-xs font-black text-slate-500 py-1">週三</div>
          <div class="text-center text-[10px] sm:text-xs font-black text-slate-500 py-1">週四</div>
          <div class="text-center text-[10px] sm:text-xs font-black text-slate-500 py-1">週五</div>
          <div class="text-center text-[10px] sm:text-xs font-black text-indigo-500 py-1">週六</div>
        </div>
        
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2 auto-rows-fr">
          <!-- JS 動態生成 -->
        </div>

        <div class="mt-5 pt-4 border-t border-slate-100 flex flex-col sm:flex-row gap-3">
          <button onclick="fetchSpreadsheetData(false)" class="flex-1 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 p-3 rounded-xl font-bold text-sm transition shadow-sm flex justify-center items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-down text-indigo-500"></i> 手動同步雲端
          </button>
          <button id="btnSubmitLeave" onclick="submitMonthlyLeave()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-bold text-sm transition shadow-md flex justify-center items-center gap-2">
            <i class="fa-regular fa-paper-plane"></i> 提交本月排休表
          </button>
        </div>
      </div>
    </div>

  </div> 

  <!-- ================= 手機版專屬底部導覽列 ================= -->
  <div id="mobileBottomNav" class="sm:hidden fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-40 pb-safe">
    <div class="flex justify-around items-center h-16 px-2">
      <button id="mobileNavDaily" onclick="switchTab('daily')" class="flex flex-col items-center justify-center w-full h-full text-indigo-600 font-bold text-[11px] space-y-1 transition">
        <i class="fa-solid fa-location-dot text-lg"></i>
        <span>打卡首頁</span>
      </button>
      <button id="mobileNavSummary" onclick="switchTab('summary')" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 font-medium text-[11px] space-y-1 transition">
        <i class="fa-regular fa-calendar-days text-lg"></i>
        <span>考勤總表</span>
      </button>
      <button onclick="logout()" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-rose-500 font-medium text-[11px] space-y-1 transition">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
        <span>登出</span>
      </button>
    </div>
  </div>

  <!-- ================= 互動彈窗 ================= -->
  <div id="singleLeaveModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4">
    <div class="glass-panel p-6 rounded-3xl w-full max-w-sm shadow-2xl relative">
      <button onclick="closeSingleLeaveModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="text-lg font-black text-slate-800 mb-4"><i class="fa-solid fa-file-signature text-indigo-500 mr-2"></i>單日請假申請</h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">選擇日期</label>
          <input type="date" id="slDate" class="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">假別設定</label>
          <select id="slType" class="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 font-medium">
            <option value="特休">特休 (年假)</option>
            <option value="事假">事假</option>
            <option value="病假">病假</option>
            <option value="喪假">喪假</option>
            <option value="婚假">婚假</option>
            <option value="產假/陪產假">產假 / 陪產假</option>
            <option value="取消請假" class="text-rose-500 font-bold">❌ 撤銷此日請假</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">申請時數 (小時)</label>
          <input type="number" id="slHours" value="8" min="0.5" max="8" step="0.5" class="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">備註/事由</label>
          <input type="text" id="slNotes" placeholder="選填" class="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500">
        </div>
        
        <button onclick="submitSingleLeave()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-sm px-5 py-3 transition shadow-md flex justify-center items-center gap-2 mt-2">
          <i class="fa-solid fa-paper-plane"></i> 提出申請
        </button>
      </div>
    </div>
  </div>

  <div id="loadingOverlay" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm">
    <div class="bg-white p-5 rounded-2xl shadow-xl flex items-center space-x-4 border border-slate-100">
      <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-3xl"></i>
      <span id="loadingText" class="text-slate-700 font-bold text-sm tracking-wide">處理中...</span>
    </div>
  </div>
  
  <div id="customAlert" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4">
    <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full text-center border border-slate-100 transform scale-95 transition-transform duration-200">
      <div id="alertIcon" class="w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 text-3xl"></div>
      <h4 id="alertTitle" class="text-lg font-black text-slate-800 mb-2"></h4>
      <p id="alertMessage" class="text-sm text-slate-500 font-medium mb-6"></p>
      <button onclick="closeCustomAlert()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl px-4 py-3 transition">
        確定
      </button>
    </div>
  </div>

  <!-- Javascript 完整核心邏輯 (V3.4) -->
  <script>
    var gasUrl = "https://script.google.com/macros/s/AKfycbz8SRRpGeY0ls9yAUZYWLaHYaokk1j6pdDnG_6z1wuBW-08WnbRU3geXNi0NM2lDdMp/exec";
    
    var companyLat = 24.9535;
    var companyLng = 121.2250;
    var companyRadius = 200; // 預設 200 公尺

    var CACHE_KEY_ACCOUNTS = "att_app_accounts_cache_v34";
    var CACHE_KEY_ATTENDANCE = "att_app_attendance_cache_v34";
    var CACHE_KEY_HOLIDAYS = "att_app_holidays_cache_v34";
    var CACHE_KEY_USER = "att_app_current_user_v34";

    var allAccounts = [];
    var allAttendance = [];
    var allHolidays = [];
    var currentUser = null;
    var viewTargetUsername = ""; 
    var currentMonthDate = new Date();
    var activeTab = "daily"; 

    var map = null;
    var companyMarkers = [];
    var companyFenceCircles = [];
    var userMarker = null;
    var userAccCircle = null;
    var lastUserLat = null;
    var lastUserLng = null;
    var isInGpsRange = false;
    var allowedLocations = [];
    var currentValidLocationName = ""; 

    window.onload = function() {
      var now = new Date();
      document.getElementById("txtCurrentDateDisplay").innerText = 
        `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

      var savedUserStr = localStorage.getItem(CACHE_KEY_USER);
      if (savedUserStr) {
        try {
          currentUser = JSON.parse(savedUserStr);
          viewTargetUsername = currentUser.username;
          document.getElementById("loginOverlay").classList.add("hidden");
          document.getElementById("mainApp").classList.remove("hidden");
          
          initUserSession();
          var loaded = loadDataFromLocalStorage();
          if (loaded) refreshView();
          fetchSpreadsheetData(true); 
        } catch(e) {
          localStorage.removeItem(CACHE_KEY_USER);
        }
      }
    };

    function initInteractiveMap() {
      if (map) return; 
      try {
        var startLat = allowedLocations.length > 0 ? allowedLocations[0].lat : companyLat;
        var startLng = allowedLocations.length > 0 ? allowedLocations[0].lng : companyLng;

        map = L.map("liveMap").setView([startLat, startLng], 16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        drawCompanyLocations();
        updateCurrentPositionOnly(); 
      } catch (err) {
        console.error("Leaflet Init Error:", err);
      }
    }

    function drawCompanyLocations() {
      if (!map) return;
      companyMarkers.forEach(m => map.removeLayer(m));
      companyFenceCircles.forEach(c => map.removeLayer(c));
      companyMarkers = [];
      companyFenceCircles = [];

      var companyIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div style="background-color: #ef4444; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 14px;"><i class="fa-solid fa-building"></i></div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      allowedLocations.forEach(loc => {
        var marker = L.marker([loc.lat, loc.lng], { icon: companyIcon }).addTo(map)
          .bindPopup(`<b>🏢 ${loc.name}</b><br>允許半徑：${loc.radius} 公尺`);
        var circle = L.circle([loc.lat, loc.lng], {
          color: "#f59e0b",
          fillColor: "#fbbf24",
          fillOpacity: 0.15,
          radius: loc.radius
        }).addTo(map);

        companyMarkers.push(marker);
        companyFenceCircles.push(circle);
      });
    }

    function renderUserMapLocation(lat, lng, accuracy) {
      if (!map) return;
      lastUserLat = lat;
      lastUserLng = lng;

      var userIcon = L.divIcon({
        className: 'user-pos-icon',
        html: `<div style="background-color: #3b82f6; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2.5px solid white; box-shadow: 0 0 10px rgba(59,130,246,0.8);"><i class="fa-solid fa-user-large text-[10px]"></i></div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      if (userMarker) {
        userMarker.setLatLng([lat, lng]);
      } else {
        userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map).bindPopup("<b>📍 您目前的位置</b>");
      }

      if (userAccCircle) {
        userAccCircle.setLatLng([lat, lng]);
        userAccCircle.setRadius(accuracy || 15);
      } else {
        userAccCircle = L.circle([lat, lng], {
          color: "#3b82f6",
          fillColor: "#60a5fa",
          fillOpacity: 0.2,
          radius: accuracy || 15
        }).addTo(map);
      }

      document.getElementById("mapInfoPos").innerText = `目前座標：${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      document.getElementById("mapInfoAcc").innerText = `精確度：±${Math.round(accuracy || 0)}m`;
    }

    function centerMapOnUser() {
      if (map && lastUserLat && lastUserLng) {
        map.setView([lastUserLat, lastUserLng], 17);
        if (userMarker) userMarker.openPopup();
      } else {
        updateCurrentPositionOnly();
      }
    }

    function centerMapOnCompany() {
      if (map && allowedLocations.length > 0) {
        map.setView([allowedLocations[0].lat, allowedLocations[0].lng], 16);
        if (companyMarkers.length > 0) companyMarkers[0].openPopup();
      }
    }

    function updateCurrentPositionOnly() {
      var iconDiv = document.getElementById("gpsStatusIcon");
      var textDiv = document.getElementById("gpsStatusText");
      
      iconDiv.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-lg"></i>`;
      iconDiv.className = "w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center shrink-0";
      textDiv.innerText = "定位擷取中...";
      isInGpsRange = false;
      currentValidLocationName = "";

      if (!navigator.geolocation) {
        textDiv.innerText = "瀏覽器不支援 GPS 定位";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var uLat = pos.coords.latitude;
          var uLng = pos.coords.longitude;
          var accuracy = pos.coords.accuracy;

          var nearestDist = Infinity;
          var validLoc = null;

          allowedLocations.forEach(loc => {
            var dist = calculateDistanceMeters(uLat, uLng, loc.lat, loc.lng);
            if (dist < nearestDist) nearestDist = dist;
            if (dist <= loc.radius && !validLoc) {
              validLoc = loc;
            }
          });

          isInGpsRange = (validLoc !== null);

          if (isInGpsRange) {
            currentValidLocationName = validLoc.name;
            iconDiv.innerHTML = `<i class="fa-solid fa-check text-xl"></i>`;
            iconDiv.className = "w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0 shadow-inner";
            textDiv.innerHTML = `<span class="text-emerald-600">已在 <b>${validLoc.name}</b> 範圍內 (距 ${nearestDist}m)</span>`;
          } else {
            iconDiv.innerHTML = `<i class="fa-solid fa-xmark text-xl"></i>`;
            iconDiv.className = "w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 shadow-inner";
            textDiv.innerHTML = `<span class="text-rose-600">超出打卡範圍 (最近距 ${nearestDist}m)</span>`;
          }
          renderUserMapLocation(uLat, uLng, accuracy);
        },
        function(err) {
          iconDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-lg"></i>`;
          iconDiv.className = "w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center shrink-0";
          textDiv.innerText = "定位失敗，請允許取用位置";
        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 15000 }
      );
    }

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      var R = 6371e3;
      var rad = Math.PI / 180;
      var dLat = (lat2 - lat1) * rad;
      var dLon = (lon2 - lon1) * rad;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function doClockAction(type) {
      if (!isInGpsRange || !currentValidLocationName) {
        showCustomAlert("打卡失敗", "目前尚未定位成功或不在合法打卡範圍內，請點擊上方「更新定位」確認位置。", "error");
        return;
      }

      showLoading("正在將打卡紀錄上傳雲端...");
      var targetUrl = `${gasUrl}?action=webClockIn&username=${encodeURIComponent(currentUser.username)}&type=${type}&locationName=${encodeURIComponent(currentValidLocationName)}`;
      
      fetch(targetUrl)
        .then(res => res.json())
        .then(res => {
          hideLoading();
          if (res.result === "success") {
            showCustomAlert("打卡成功", res.message, "success");
            fetchSpreadsheetData(false);
          } else {
            showCustomAlert("打卡失敗", res.message || "未知錯誤", "error");
          }
        })
        .catch(err => {
          hideLoading();
          showCustomAlert("連線錯誤", "無法寫入雲端伺服器，請稍後再試", "error");
        });
    }

    function switchTab(tab) {
      activeTab = tab;
      var vDaily = document.getElementById("viewDailyContainer");
      var vSummary = document.getElementById("viewSummaryContainer");
      var btnD = document.getElementById("tabBtnDaily");
      var btnS = document.getElementById("tabBtnSummary");
      var mNavD = document.getElementById("mobileNavDaily");
      var mNavS = document.getElementById("mobileNavSummary");

      if (tab === "daily") {
        vDaily.classList.remove("hidden");
        vSummary.classList.add("hidden");
        btnD.className = "nav-tab-active px-5 py-2 rounded-xl transition flex items-center gap-2 text-sm";
        btnS.className = "text-indigo-100 hover:text-white px-5 py-2 rounded-xl transition flex items-center gap-2 text-sm font-medium";
        mNavD.className = "flex flex-col items-center justify-center w-full h-full text-indigo-600 font-bold text-[11px] space-y-1 transition";
        mNavS.className = "flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 font-medium text-[11px] space-y-1 transition";
        setTimeout(() => { if(map) map.invalidateSize(); }, 150);
      } else {
        vDaily.classList.add("hidden");
        vSummary.classList.remove("hidden");
        btnD.className = "text-indigo-100 hover:text-white px-5 py-2 rounded-xl transition flex items-center gap-2 text-sm font-medium";
        btnS.className = "nav-tab-active px-5 py-2 rounded-xl transition flex items-center gap-2 text-sm";
        mNavD.className = "flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 font-medium text-[11px] space-y-1 transition";
        mNavS.className = "flex flex-col items-center justify-center w-full h-full text-indigo-600 font-bold text-[11px] space-y-1 transition";
      }
    }

    function initUserSession() {
      document.getElementById("txtUserInitials").innerText = currentUser.name.charAt(0);
      document.getElementById("txtWelcomeName").innerText = "哈囉，" + currentUser.name;
      
      var badge = document.getElementById("roleBadge");
      var adminSelector = document.getElementById("adminUserSelector");
      
      if (currentUser.role.toLowerCase() === "admin") {
        badge.classList.remove("hidden");
        adminSelector.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
        adminSelector.classList.add("hidden");
      }

      allowedLocations = [];
      if (currentUser && currentUser.gpsLocations) {
        var parts = currentUser.gpsLocations.split(/[\|;]/);
        parts.forEach((p, idx) => {
          var cleanP = p.replace(/"/g, "").trim();
          if(!cleanP) return;
          var coords = cleanP.split(",");
          if (coords.length >= 2) {
            var pLat = parseFloat(coords[0]);
            var pLng = parseFloat(coords[1]);
            var pRad = coords.length >= 3 ? parseInt(coords[2], 10) : NaN;
            if (!isNaN(pLat) && !isNaN(pLng)) {
              allowedLocations.push({
                lat: pLat,
                lng: pLng,
                radius: (!isNaN(pRad) && pRad > 0) ? pRad : companyRadius,
                name: coords.length >= 4 ? coords[3] : ("打卡點 " + (idx + 1))
              });
            }
          }
        });
      }
      
      if (allowedLocations.length === 0) {
        allowedLocations.push({ lat: companyLat, lng: companyLng, radius: companyRadius, name: "預設打卡點" });
      }

      var rText = allowedLocations.length > 1 ? "多節點專屬定位" : (allowedLocations[0].radius + "m");
      document.getElementById("txtCompanyRadiusDisplay").innerText = rText;

      initInteractiveMap();
    }

    function refreshView() {
      if (currentUser.role.toLowerCase() === "admin") {
        populateEmployeeDropdown();
      }
      renderCalendar();
      calculateMonthlyStats();
      updateClockButtonsState();
    }

    function updateClockButtonsState() {
      if (!currentUser) return;
      var todayStr = normalizeDate(new Date());
      var userRecords = allAttendance.filter(r => r.username === currentUser.username);
      var todayRec = userRecords.find(r => normalizeDate(r.date) === todayStr);

      var hasClockIn = todayRec && todayRec.clockIn;
      var hasClockOut = todayRec && todayRec.clockOut;

      var btnIn = document.getElementById("btnClockIn");
      var btnOut = document.getElementById("btnClockOut");

      if (btnIn) {
        if (hasClockIn) {
          btnIn.onclick = null;
          btnIn.className = "relative bg-slate-200 text-slate-500 p-4 sm:p-5 rounded-2xl shadow-sm cursor-not-allowed flex flex-col items-center justify-center gap-1";
          btnIn.innerHTML = `<i class="fa-solid fa-check-circle text-3xl sm:text-4xl mb-1"></i><span class="font-extrabold text-base sm:text-lg tracking-wider">已上班</span><span class="text-[10px] sm:text-xs font-bold">(${todayRec.clockIn})</span>`;
        } else {
          btnIn.onclick = function() { doClockAction('clockIn'); };
          btnIn.className = "relative group overflow-hidden bg-gradient-to-br from-emerald-400 to-emerald-600 text-white p-4 sm:p-5 rounded-2xl shadow-lg hover:shadow-xl transition active:scale-95 flex flex-col items-center justify-center gap-1";
          btnIn.innerHTML = `<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
            <i class="fa-solid fa-fingerprint text-3xl sm:text-4xl mb-1 relative z-10"></i>
            <span class="font-extrabold text-base sm:text-lg tracking-wider relative z-10">上班打卡</span>
            <span class="text-[10px] sm:text-xs text-emerald-100 font-medium relative z-10">(驗證 GPS 位置)</span>`;
        }
      }

      if (btnOut) {
        if (hasClockOut) {
          btnOut.onclick = null;
          btnOut.className = "relative bg-slate-200 text-slate-500 p-4 sm:p-5 rounded-2xl shadow-sm cursor-not-allowed flex flex-col items-center justify-center gap-1";
          btnOut.innerHTML = `<i class="fa-solid fa-check-circle text-3xl sm:text-4xl mb-1"></i><span class="font-extrabold text-base sm:text-lg tracking-wider">已下班</span><span class="text-[10px] sm:text-xs font-bold">(${todayRec.clockOut})</span>`;
        } else {
          btnOut.onclick = function() { doClockAction('clockOut'); };
          btnOut.className = "relative group overflow-hidden bg-gradient-to-br from-rose-400 to-rose-600 text-white p-4 sm:p-5 rounded-2xl shadow-lg hover:shadow-xl transition active:scale-95 flex flex-col items-center justify-center gap-1";
          btnOut.innerHTML = `<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
            <i class="fa-solid fa-house-person-leave text-3xl sm:text-4xl mb-1 relative z-10"></i>
            <span class="font-extrabold text-base sm:text-lg tracking-wider relative z-10">下班打卡</span>
            <span class="text-[10px] sm:text-xs text-rose-100 font-medium relative z-10">(驗證 GPS 位置)</span>`;
        }
      }
    }

    function fetchSpreadsheetData(isSilent) {
      if (!isSilent) showLoading("同步雲端資料中...");
      
      fetch(`${gasUrl}?action=getAllData`)
        .then(res => res.json())
        .then(data => {
          if (!isSilent) hideLoading();
          if (data.result === "success") {
            allAccounts = data.accounts || [];
            allAttendance = data.attendance || [];
            allHolidays = data.holidays || [];

            localStorage.setItem(CACHE_KEY_ACCOUNTS, JSON.stringify(allAccounts));
            localStorage.setItem(CACHE_KEY_ATTENDANCE, JSON.stringify(allAttendance));
            localStorage.setItem(CACHE_KEY_HOLIDAYS, JSON.stringify(allHolidays));

            var found = allAccounts.find(a => a.username === currentUser.username);
            if (found) {
              currentUser = found;
              localStorage.setItem(CACHE_KEY_USER, JSON.stringify(currentUser));
              initUserSession();
            }

            refreshView();
            if (!isSilent) showCustomAlert("同步成功", "已成功從 Google 雲端載入最新考勤紀錄！", "success");
          } else {
            if (!isSilent) showCustomAlert("同步失敗", data.message || "伺服器異常", "error");
          }
        })
        .catch(err => {
          if (!isSilent) {
            hideLoading();
            showCustomAlert("連線失敗", "無法與 Google Apps Script 建立連線，請檢查網路。", "error");
          }
        });
    }

    function loadDataFromLocalStorage() {
      try {
        var acc = localStorage.getItem(CACHE_KEY_ACCOUNTS);
        var att = localStorage.getItem(CACHE_KEY_ATTENDANCE);
        var hol = localStorage.getItem(CACHE_KEY_HOLIDAYS);
        if (acc && att) {
          allAccounts = JSON.parse(acc);
          allAttendance = JSON.parse(att);
          allHolidays = hol ? JSON.parse(hol) : [];
          return true;
        }
      } catch (e) {}
      return false;
    }

    function handleLogin() {
      var u = document.getElementById("loginUsername").value.trim();
      var p = document.getElementById("loginPassword").value.trim();
      if (!u || !p) {
        showCustomAlert("提示", "請輸入帳號與密碼", "warning");
        return;
      }

      showLoading("驗證登入中...");
      fetch(`${gasUrl}?action=getAllData`)
        .then(res => res.json())
        .then(data => {
          hideLoading();
          if (data.result === "success") {
            allAccounts = data.accounts || [];
            allAttendance = data.attendance || [];
            allHolidays = data.holidays || [];

            localStorage.setItem(CACHE_KEY_ACCOUNTS, JSON.stringify(allAccounts));
            localStorage.setItem(CACHE_KEY_ATTENDANCE, JSON.stringify(allAttendance));
            localStorage.setItem(CACHE_KEY_HOLIDAYS, JSON.stringify(allHolidays));

            var matched = allAccounts.find(a => a.username.toLowerCase() === u.toLowerCase() && a.password === p);
            if (matched) {
              currentUser = matched;
              viewTargetUsername = currentUser.username;
              localStorage.setItem(CACHE_KEY_USER, JSON.stringify(currentUser));

              document.getElementById("loginOverlay").classList.add("hidden");
              document.getElementById("mainApp").classList.remove("hidden");

              initUserSession();
              refreshView();
            } else {
              showCustomAlert("登入失敗", "帳號或密碼錯誤，請重新確認", "error");
            }
          } else {
            showCustomAlert("錯誤", "無法連線至雲端資料庫", "error");
          }
        })
        .catch(err => {
          hideLoading();
          showCustomAlert("網路異常", "無法與後端伺服器通訊", "error");
        });
    }

    function logout() {
      localStorage.removeItem(CACHE_KEY_USER);
      currentUser = null;
      document.getElementById("mainApp").classList.add("hidden");
      document.getElementById("loginOverlay").classList.remove("hidden");
      document.getElementById("loginUsername").value = "";
      document.getElementById("loginPassword").value = "";
    }

    function populateEmployeeDropdown() {
      var sel = document.getElementById("selEmployee");
      if (!sel) return;
      sel.innerHTML = "";
      allAccounts.forEach(acc => {
        var opt = document.createElement("option");
        opt.value = acc.username;
        opt.innerText = `${acc.name} (${acc.username})`;
        if (acc.username === viewTargetUsername) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function switchEmployeeView() {
      var sel = document.getElementById("selEmployee");
      if (sel) {
        viewTargetUsername = sel.value;
        renderCalendar();
        calculateMonthlyStats();
      }
    }

    function changeMonth(dir) {
      currentMonthDate.setMonth(currentMonthDate.getMonth() + dir);
      renderCalendar();
      calculateMonthlyStats();
    }

    function renderCalendar() {
      var grid = document.getElementById("calendarGrid");
      if (!grid) return;
      grid.innerHTML = "";

      var y = currentMonthDate.getFullYear();
      var m = currentMonthDate.getMonth();
      document.getElementById("calendarMonthLabel").innerText = `${y}-${String(m + 1).padStart(2, "0")}`;

      var firstDay = new Date(y, m, 1).getDay();
      var daysInMonth = new Date(y, m + 1, 0).getDate();

      var targetAcc = allAccounts.find(a => a.username === viewTargetUsername) || currentUser;
      var records = allAttendance.filter(r => r.username === targetAcc.username);

      var todayStr = normalizeDate(new Date());

      for (var i = 0; i < firstDay; i++) {
        var emptyCell = document.createElement("div");
        emptyCell.className = "bg-slate-50/50 rounded-2xl h-20 sm:h-24 opacity-30";
        grid.appendChild(emptyCell);
      }

      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        var cellDate = new Date(y, m, d);
        var dayOfWeek = cellDate.getDay();

        var dayRec = records.find(r => normalizeDate(r.date) === dateStr);
        var holiday = allHolidays.find(h => normalizeDate(h.date) === dateStr);

        var cell = document.createElement("div");
        var bgClass = "bg-white border-slate-100";
        
        if (dayOfWeek === 0) bgClass = "bg-rose-50/60 border-rose-100";
        else if (dayOfWeek === 6) bgClass = "bg-indigo-50/40 border-indigo-100";

        var isPastOrToday = (dateStr <= todayStr);
        var isWorkday = (dayOfWeek !== 0 && dayOfWeek !== 6);

        var badgeHtml = "";
        var hasClock = dayRec && (dayRec.clockIn || dayRec.clockOut);
        var hasLeave = dayRec && (dayRec.status === "排休" || dayRec.status.indexOf("假") !== -1 || dayRec.isScheduledLeave == 1 || dayRec.leaveHours > 0);

        if (hasClock) {
          var statusColor = dayRec.status.indexOf("遲到") !== -1 ? "text-amber-600 bg-amber-50" : "text-emerald-600 bg-emerald-50";
          badgeHtml = `<div class="mt-1 text-[10px] font-bold px-1.5 py-0.5 rounded ${statusColor} truncate">${dayRec.status}</div>`;
        } else if (hasLeave) {
          var leaveLabel = dayRec.status === "排休" ? "排休" : dayRec.status;
          badgeHtml = `<div class="mt-1 text-[10px] font-bold px-1.5 py-0.5 rounded text-indigo-600 bg-indigo-50 truncate">${leaveLabel}</div>`;
        } else if (holiday) {
          bgClass = "bg-rose-100/70 border-rose-200";
          badgeHtml = `<div class="mt-1 text-[10px] font-black px-1.5 py-0.5 rounded text-rose-700 bg-rose-200/60 truncate">${holiday.name}</div>`;
        } else if (isWorkday && isPastOrToday) {
          badgeHtml = `<div class="mt-1 text-[10px] font-bold px-1.5 py-0.5 rounded text-rose-600 bg-rose-50 truncate">未打卡(缺勤)</div>`;
        }

        cell.className = `flex flex-col justify-between p-2 rounded-2xl border ${bgClass} h-20 sm:h-24 shadow-sm transition hover:shadow-md relative overflow-hidden`;
        cell.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs sm:text-sm font-black text-slate-700">${d}</span>
            ${dateStr === todayStr ? '<span class="w-2 h-2 rounded-full bg-indigo-600"></span>' : ''}
          </div>
          <div class="flex-1 flex flex-col justify-end">
            ${badgeHtml}
          </div>
        `;
        grid.appendChild(cell);
      }
    }

    function calculateMonthlyStats() {
      var y = currentMonthDate.getFullYear();
      var m = currentMonthDate.getMonth();
      var prefix = `${y}-${String(m + 1).padStart(2, "0")}`;

      var targetUsername = viewTargetUsername || currentUser.username;
      var targetAcc = allAccounts.find(a => a.username === targetUsername) || currentUser;
      var records = allAttendance.filter(r => r.username === targetUsername && r.date.indexOf(prefix) === 0);

      var lateCount = 0;
      var lateMinsTotal = 0;
      var otHoursTotal = 0;
      var leaveDaysCount = 0;

      records.forEach(r => {
        if (r.status && r.status.indexOf("遲到") !== -1) {
          lateCount++;
          var match = r.status.match(/遲到\s*(\d+)\s*分鐘/);
          if (match) lateMinsTotal += parseInt(match[1], 10);
        }
        if (r.overtime) otHoursTotal += parseFloat(r.overtime) || 0;
        if (r.status === "排休" || r.status.indexOf("假") !== -1 || r.leaveHours > 0) {
          leaveDaysCount += (r.leaveHours ? (r.leaveHours / 8) : 1);
        }
      });

      var elLateC = document.getElementById("statLateCount");
      var elLateM = document.getElementById("statLateMinutes");
      var elOT = document.getElementById("statOvertime");
      var elLeave = document.getElementById("statLeaveDays");
      var elSpl = document.getElementById("statSpecialLeave");
      var elSplInit = document.getElementById("statSpecialLeaveInitial");
      var elSplRem = document.getElementById("statSpecialLeaveDaysRem");

      if (elLateC) elLateC.innerText = lateCount;
      if (elLateM) elLateM.innerText = lateMinsTotal;
      if (elOT) elOT.innerText = otHoursTotal.toFixed(1);
      if (elLeave) elLeave.innerText = leaveDaysCount.toFixed(1);

      var initialDays = parseFloat(targetAcc.specialLeaveDays || 0);
      var totalHours = initialDays * 8;
      if (elSplInit) elSplInit.innerText = `初始 ${initialDays}天`;
      if (elSpl) elSpl.innerText = totalHours;
      if (elSplRem) elSplRem.innerText = initialDays.toFixed(1);
    }

    function submitMonthlyLeave() {
      var y = currentMonthDate.getFullYear();
      var m = currentMonthDate.getMonth();
      var yearMonthStr = `${y}-${String(m + 1).padStart(2, "0")}`;

      showLoading("提交排休中...");
      var targetAcc = allAccounts.find(a => a.username === viewTargetUsername) || currentUser;

      var leaveItems = [];
      var daysInMonth = new Date(y, m + 1, 0).getDate();
      for (var d = 1; d <= daysInMonth; d++) {
        var cellDate = new Date(y, m, d);
        if (cellDate.getDay() === 0) { 
          var dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          leaveItems.push({ date: dateStr, type: "排休", hours: 8 });
        }
      }

      fetch(`${gasUrl}?action=submitLeave&username=${encodeURIComponent(targetAcc.username)}&yearMonth=${yearMonthStr}&leaveData=${encodeURIComponent(JSON.stringify(leaveItems))}`)
        .then(res => res.json())
        .then(res => {
          hideLoading();
          if (res.result === "success") {
            showCustomAlert("成功", res.message, "success");
            fetchSpreadsheetData(false);
          } else {
            showCustomAlert("錯誤", res.message, "error");
          }
        })
        .catch(err => {
          hideLoading();
          showCustomAlert("錯誤", "提交排休失敗", "error");
        });
    }

    function openSingleLeaveModal() {
      document.getElementById("singleLeaveModal").classList.remove("hidden");
      var today = new Date().toISOString().split("T")[0];
      document.getElementById("slDate").value = today;
    }

    function closeSingleLeaveModal() {
      document.getElementById("singleLeaveModal").classList.add("hidden");
    }

    function submitSingleLeave() {
      var dateStr = document.getElementById("slDate").value;
      var type = document.getElementById("slType").value;
      var hours = document.getElementById("slHours").value;
      var notes = document.getElementById("slNotes").value;

      if (!dateStr) {
        showCustomAlert("提示", "請選擇日期", "warning");
        return;
      }

      closeSingleLeaveModal();
      showLoading("儲存請假中...");

      var targetAcc = allAccounts.find(a => a.username === viewTargetUsername) || currentUser;
      fetch(`${gasUrl}?action=saveSingleLeave&username=${encodeURIComponent(targetAcc.username)}&date=${dateStr}&leaveType=${encodeURIComponent(type)}&leaveHours=${hours}&notes=${encodeURIComponent(notes)}`)
        .then(res => res.json())
        .then(res => {
          hideLoading();
          if (res.result === "success") {
            showCustomAlert("成功", res.message, "success");
            fetchSpreadsheetData(false);
          } else {
            showCustomAlert("錯誤", res.message, "error");
          }
        })
        .catch(err => {
          hideLoading();
          showCustomAlert("錯誤", "儲存單日請假失敗", "error");
        });
    }

    function normalizeDate(dateInput) {
      if (!dateInput) return "";
      var d = new Date(dateInput);
      if (isNaN(d.getTime())) {
        return String(dateInput).substring(0, 10);
      }
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function showLoading(text) {
      document.getElementById("loadingText").innerText = text || "處理中...";
      document.getElementById("loadingOverlay").classList.remove("hidden");
    }

    function hideLoading() {
      document.getElementById("loadingOverlay").classList.add("hidden");
    }

    function showCustomAlert(title, message, type) {
      var icon = document.getElementById("alertIcon");
      if (type === "success") {
        icon.className = "w-16 h-16 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-4 text-3xl";
        icon.innerHTML = '<i class="fa-solid fa-check"></i>';
      } else if (type === "error") {
        icon.className = "w-16 h-16 mx-auto rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mb-4 text-3xl";
        icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      } else {
        icon.className = "w-16 h-16 mx-auto rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mb-4 text-3xl";
        icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
      }
      document.getElementById("alertTitle").innerText = title;
      document.getElementById("alertMessage").innerText = message;
      document.getElementById("customAlert").classList.remove("hidden");
    }

    function closeCustomAlert() {
      document.getElementById("customAlert").classList.add("hidden");
    }
  </script>
</body>
</html>
